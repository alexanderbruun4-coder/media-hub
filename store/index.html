<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grail House</title>
  <meta name="description" content="Curated resale. Hand-picked sneakers, outerwear and designer pieces, each checked for authenticity." />
  <meta name="theme-color" content="#141414" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23141414'/><text x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23f6f4ef' text-anchor='middle'>G</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- ?v= makes browsers fetch fresh files after a code update. Bump it when changing css/js. -->
  <link rel="stylesheet" href="css/store.css?v=4" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="announce" id="announce" aria-live="polite"></div>

  <header class="header" id="header">
    <div class="wrap header-inner">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
      <a href="#/" class="logo" id="logo">Grail House</a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Search"><svg><use href="#i-search"/></svg></button>
        <a class="icon-btn" href="#/saved" aria-label="Saved items"><svg><use href="#i-heart"/></svg><span class="count" id="savedCount" hidden></span></a>
        <button class="icon-btn" id="bagBtn" aria-label="Shopping bag"><svg><use href="#i-bag"/></svg><span class="count" id="bagCount" hidden></span></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading"><span></span></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Search -->
  <div class="layer search-layer" id="searchLayer" hidden>
    <div class="search-panel">
      <div class="wrap">
        <form class="search-form" id="searchForm" role="search">
          <svg><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="Search sneakers, jackets, bags…" autocomplete="off" aria-label="Search" />
          <button type="button" class="icon-btn" data-close aria-label="Close search"><svg><use href="#i-close"/></svg></button>
        </form>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="layer" id="menuLayer" hidden>
    <aside class="drawer drawer-left" aria-label="Menu">
      <div class="drawer-head">
        <span class="logo logo-sm" id="menuLogo"></span>
        <button class="icon-btn" data-close aria-label="Close menu"><svg><use href="#i-close"/></svg></button>
      </div>
      <nav class="menu-links" id="menuLinks"></nav>
    </aside>
  </div>

  <!-- Bag -->
  <div class="layer" id="bagLayer" hidden>
    <aside class="drawer" aria-label="Shopping bag">
      <div class="drawer-head">
        <h2 class="drawer-title">Your bag</h2>
        <button class="icon-btn" data-close aria-label="Close bag"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="drawer-body" id="bagBody"></div>
      <div class="drawer-foot" id="bagFoot"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></symbol>
      <symbol id="i-return" viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 0 1 0 10H8"/><path d="M8 5L4 9l4 4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></symbol>
    </defs>
  </svg>

  <script src="js/fx.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
